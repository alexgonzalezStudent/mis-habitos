<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ritmo – Hábitos y Rachas</title>

  <!-- Configuración PWA para instalar como App Nativa en Android / iOS -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ritmo" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3176/3176366.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .day-btn {
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .day-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Barra Superior -->
  <header class="sticky top-0 z-30 glass-card border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-lg">
          🔥
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">Ritmo</h1>
          <p id="currentDateLabel" class="text-xs text-slate-400"></p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportData()" title="Exportar respaldo" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700">
          ⬇️ Exportar
        </button>
        <label title="Importar respaldo" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 cursor-pointer">
          ⬆️ Importar
          <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)" />
        </label>
        <button onclick="openModal()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs sm:text-sm font-semibold text-white shadow-lg shadow-indigo-600/30">
          + Nuevo
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5 space-y-6">

    <!-- Tarjetas de Resumen Rápido -->
    <section class="grid grid-cols-3 gap-2.5 sm:gap-4">
      <div class="glass-card rounded-2xl p-3.5 sm:p-4">
        <span class="text-[11px] sm:text-xs text-slate-400 font-medium">Hoy</span>
        <div class="mt-1 flex items-baseline gap-1.5">
          <span id="statToday" class="text-xl sm:text-2xl font-extrabold text-white">0/0</span>
          <span id="statTodayPct" class="text-xs text-emerald-400 font-semibold">0%</span>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-3.5 sm:p-4">
        <span class="text-[11px] sm:text-xs text-slate-400 font-medium">Éxito Semanal</span>
        <div class="mt-1 flex items-baseline gap-1.5">
          <span id="statWeekPct" class="text-xl sm:text-2xl font-extrabold text-indigo-400">0%</span>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-3.5 sm:p-4">
        <span class="text-[11px] sm:text-xs text-slate-400 font-medium">Mejor Racha</span>
        <div class="mt-1 flex items-baseline gap-1">
          <span id="statBestStreak" class="text-xl sm:text-2xl font-extrabold text-amber-400">0d</span>
          <span class="text-xs">🔥</span>
        </div>
      </div>
    </section>

    <!-- Navegador de Semanas y Filtros de Horario -->
    <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 glass-card rounded-2xl p-3">
      <!-- Selector de semana -->
      <div class="flex items-center justify-between sm:justify-start gap-2">
        <button onclick="changeWeek(-1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">
          ◀ Ant.
        </button>
        <div class="text-center px-2">
          <span id="weekRangeLabel" class="text-xs sm:text-sm font-bold text-white block"></span>
          <button onclick="goToCurrentWeek()" id="btnTodayWeek" class="text-[11px] text-indigo-400 hover:underline hidden">
            Volver a esta semana
          </button>
        </div>
        <button onclick="changeWeek(1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">
          Sig. ▶
        </button>
      </div>

      <!-- Filtros por momento del día -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
        <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white whitespace-nowrap">
          Todos
        </button>
        <button onclick="setFilter('Mañana')" id="filter-Mañana" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">
          ☀️ Mañana
        </button>
        <button onclick="setFilter('Tarde')" id="filter-Tarde" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">
          ⚡ Tarde / Libre
        </button>
        <button onclick="setFilter('Noche')" id="filter-Noche" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">
          🌙 Noche
        </button>
      </div>
    </section>

    <!-- Lista de Tarjetas de Hábitos -->
    <section id="habitsContainer" class="space-y-3"></section>

    <!-- Gráficos Interactivos -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
      <div class="glass-card rounded-2xl p-4">
        <h3 class="text-xs sm:text-sm font-bold text-slate-200 mb-3">📊 Hábitos Completados por Día (Semana vista)</h3>
        <div class="h-52">
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4">
        <h3 class="text-xs sm:text-sm font-bold text-slate-200 mb-3">🔥 Racha Actual por Hábito</h3>
        <div class="h-52">
          <canvas id="streakChart"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal para Crear Nuevo Hábito -->
  <div id="habitModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-md w-full p-5 border border-slate-700 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-white">Nuevo Hábito</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Nombre del hábito</label>
          <input id="habitNameInput" type="text" placeholder="Ej: Practicar Guitarra, Inglés, Ejercicio..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Ícono (Emoji)</label>
            <input id="habitIconInput" type="text" value="⚡" maxlength="2" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-center text-white" />
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Momento del día</label>
            <select id="habitTimeInput" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white">
              <option value="Mañana">☀️ Mañana</option>
              <option value="Tarde">⚡ Tarde / Libre</option>
              <option value="Noche">🌙 Noche</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Color identificador</label>
          <div class="flex gap-2 pt-1" id="colorPicker">
            <button type="button" onclick="selectColor('#10b981')" data-color="#10b981" class="w-7 h-7 rounded-full bg-emerald-500 ring-2 ring-white"></button>
            <button type="button" onclick="selectColor('#6366f1')" data-color="#6366f1" class="w-7 h-7 rounded-full bg-indigo-500"></button>
            <button type="button" onclick="selectColor('#f59e0b')" data-color="#f59e0b" class="w-7 h-7 rounded-full bg-amber-500"></button>
            <button type="button" onclick="selectColor('#ec4899')" data-color="#ec4899" class="w-7 h-7 rounded-full bg-pink-500"></button>
            <button type="button" onclick="selectColor('#06b6d4')" data-color="#06b6d4" class="w-7 h-7 rounded-full bg-cyan-500"></button>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-semibold text-slate-300">Cancelar</button>
        <button onclick="saveNewHabit()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white">Guardar Hábito</button>
      </div>
    </div>
  </div>

  <!-- Botón Flotante para Instalar como App en Android/Chrome -->
  <button id="pwa-install-btn" style="display:none; position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:9999; background:linear-gradient(135deg,#6366f1,#4f46e5); color:white; padding:12px 24px; border-radius:999px; font-weight:700; font-size:13px; box-shadow:0 10px 25px rgba(79,70,229,0.55); border:1px solid rgba(255,255,255,0.2); cursor:pointer;">
    📲 Instalar App Ritmo
  </button>

  <script>
    const STORAGE_KEY = 'ritmo_habitos_pwa_v3';
    const DAY_LETTERS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    const DAY_NAMES = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

    const DEFAULT_HABITS = [
      { id: 'h1', name: 'Ejercicio matutino (activar el cuerpo)', icon: '🏋️', category: 'Mañana', color: '#10b981', history: {} },
      { id: 'h2', name: 'Inglés (Gramática y vocabulario)', icon: '🇬🇧', category: 'Tarde', color: '#6366f1', history: {} },
      { id: 'h3', name: 'Practicar Python & Código', icon: '🐍', category: 'Tarde', color: '#f59e0b', history: {} },
      { id: 'h4', name: 'Lectura enfocada', icon: '📖', category: 'Tarde', color: '#06b6d4', history: {} },
      { id: 'h5', name: 'Practicar Guitarra (Acordes y agilidad)', icon: '🎸', category: 'Noche', color: '#ec4899', history: {} }
    ];

    let habits = [];
    let currentWeekOffset = 0;
    let activeFilter = 'all';
    let selectedColor = '#10b981';
    let dailyChartInstance = null;
    let streakChartInstance = null;

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getMondayOfWeek(offsetWeeks = 0) {
      const now = new Date();
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday + (offsetWeeks * 7));
    }

    function getWeekDates(offsetWeeks = 0) {
      const monday = getMondayOfWeek(offsetWeeks);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        dates.push({
          dateObj: d,
          key: formatDateKey(d),
          dayNumber: d.getDate(),
          letter: DAY_LETTERS[i],
          shortName: DAY_NAMES[i]
        });
      }
      return dates;
    }

    function calculateStreak(habit) {
      const today = new Date();
      let checkDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const todayKey = formatDateKey(checkDate);

      if (!habit.history || !habit.history[todayKey]) {
        checkDate.setDate(checkDate.getDate() - 1);
      }

      let streak = 0;
      while (true) {
        const key = formatDateKey(checkDate);
        if (habit.history && habit.history[key]) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          habits = JSON.parse(raw);
        } catch (e) {
          habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
        }
      } else {
        habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    // REGLA ESTRICTA TIPO DUOLINGO: Solo se puede marcar el día de hoy
    function toggleDay(habitId, dateKey) {
      const todayKey = formatDateKey(new Date());
      
      if (dateKey !== todayKey) {
        alert('¡Ey! Solo puedes registrar o cambiar el hábito del día de hoy. Lo pasado, pisado. 🎯');
        return;
      }

      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;
      if (!habit.history) habit.history = {};
      
      if (habit.history[dateKey]) {
        delete habit.history[dateKey];
      } else {
        habit.history[dateKey] = true;
      }
      saveData();
      renderAll();
    }

    function deleteHabit(habitId) {
      if (!confirm('¿Seguro que deseas eliminar este hábito?')) return;
      habits = habits.filter(h => h.id !== habitId);
      saveData();
      renderAll();
    }

    function changeWeek(dir) {
      currentWeekOffset += dir;
      renderAll();
    }

    function goToCurrentWeek() {
      currentWeekOffset = 0;
      renderAll();
    }

    function setFilter(filterVal) {
      activeFilter = filterVal;
      ['all', 'Mañana', 'Tarde', 'Noche'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (!btn) return;
        if (f === filterVal) {
          btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white whitespace-nowrap';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap';
        }
      });
      renderAll();
    }

    function renderAll() {
      const todayKey = formatDateKey(new Date());
      const weekDates = getWeekDates(currentWeekOffset);

      const now = new Date();
      document.getElementById('currentDateLabel').textContent = now.toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'short'
      });

      const firstD = weekDates[0].dateObj;
      const lastD = weekDates[6].dateObj;
      document.getElementById('weekRangeLabel').textContent =
        `${firstD.getDate()} ${firstD.toLocaleDateString('es-ES', { month: 'short' })} - ${lastD.getDate()} ${lastD.toLocaleDateString('es-ES', { month: 'short' })}`;

      const btnToday = document.getElementById('btnTodayWeek');
      btnToday.classList.toggle('hidden', currentWeekOffset === 0);

      const totalHabits = habits.length;
      const completedToday = habits.filter(h => h.history && h.history[todayKey]).length;
      const todayPct = totalHabits > 0 ? Math.round((completedToday / totalHabits) * 100) : 0;

      let weekCompletedCount = 0;
      const totalWeekPossible = totalHabits * 7;
      habits.forEach(h => {
        weekDates.forEach(d => {
          if (h.history && h.history[d.key]) weekCompletedCount++;
        });
      });
      const weekPct = totalWeekPossible > 0 ? Math.round((weekCompletedCount / totalWeekPossible) * 100) : 0;

      let bestStreak = 0;
      habits.forEach(h => {
        const s = calculateStreak(h);
        if (s > bestStreak) bestStreak = s;
      });

      document.getElementById('statToday').textContent = `${completedToday}/${totalHabits}`;
      document.getElementById('statTodayPct').textContent = `${todayPct}%`;
      document.getElementById('statWeekPct').textContent = `${weekPct}%`;
      document.getElementById('statBestStreak').textContent = `${bestStreak}d`;

      const container = document.getElementById('habitsContainer');
      container.innerHTML = '';

      const filteredHabits = activeFilter === 'all'
        ? habits
        : habits.filter(h => h.category === activeFilter);

      if (filteredHabits.length === 0) {
        container.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-slate-400 text-sm">
            No hay hábitos en este horario. Toca <b>+ Nuevo</b> para agregar uno.
          </div>
        `;
      } else {
        filteredHabits.forEach(habit => {
          const streak = calculateStreak(habit);
          const weekDone = weekDates.filter(d => habit.history && habit.history[d.key]).length;

          const card = document.createElement('div');
          card.className = 'glass-card rounded-2xl p-3.5 sm:p-4 space-y-3';

          const daysHtml = weekDates.map(d => {
            const isDone = habit.history && habit.history[d.key];
            const isToday = d.key === todayKey;
            const isPast = d.key < todayKey;
            
            let bgStyle = '';
            let labelContent = '';

            if (isDone) {
              // Cumplido (sea hoy o pasado)
              bgStyle = `background-color: ${habit.color}; color: #ffffff; border-color: ${habit.color};`;
              labelContent = '✓';
            } else if (isPast) {
              // Pasado no cumplido: tachado y bloqueado (filosofía Duolingo)
              bgStyle = `background-color: rgba(15, 23, 42, 0.4); color: #475569; border-color: rgba(255,255,255,0.02); opacity: 0.5;`;
              labelContent = '✕';
            } else if (isToday) {
              // Hoy pendiente
              bgStyle = `background-color: rgba(30, 41, 59, 0.9); color: #94a3b8; border-color: #6366f1;`;
              labelContent = d.dayNumber;
            } else {
              // Días futuros
              bgStyle = `background-color: rgba(15, 23, 42, 0.2); color: #334155; border-color: transparent; opacity: 0.3;`;
              labelContent = d.dayNumber;
            }

            return `
              <button onclick="toggleDay('${habit.id}', '${d.key}')"
                style="${bgStyle}"
                class="day-btn flex flex-col items-center justify-center py-2 rounded-xl border text-center select-none">
                <span class="text-[10px] font-semibold opacity-80">${d.letter}</span>
                <span class="text-xs sm:text-sm font-bold leading-tight mt-0.5">${labelContent}</span>
              </button>
            `;
          }).join('');

          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0" style="background:${habit.color}22; border:1px solid ${habit.color}55;">
                  ${habit.icon}
                </div>
                <div>
                  <h4 class="text-sm font-bold text-white leading-snug">${habit.name}</h4>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium">${habit.category}</span>
                    <span class="text-[11px] text-slate-400">${weekDone}/7 esta sem.</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <div class="px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold flex items-center gap-1">
                  🔥 ${streak}d
                </div>
                <button onclick="deleteHabit('${habit.id}')" class="text-slate-500 hover:text-rose-400 text-xs px-1.5 py-1">
                  🗑️
                </button>
              </div>
            </div>

            <div class="grid grid-cols-7 gap-1.5 pt-1">
              ${daysHtml}
            </div>
          `;

          container.appendChild(card);
        });
      }

      updateCharts(weekDates);
    }

    function updateCharts(weekDates) {
      const labels = weekDates.map(d => `${d.shortName} ${d.dayNumber}`);
      const dailyCounts = weekDates.map(d =>
        habits.filter(h => h.history && h.history[d.key]).length
      );

      const ctxBar = document.getElementById('dailyBarChart').getContext('2d');
      if (dailyChartInstance) dailyChartInstance.destroy();
      dailyChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Completados',
            data: dailyCounts,
            backgroundColor: '#6366f1',
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, max: Math.max(habits.length, 5), ticks: { stepSize: 1, color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { display: false } }
          }
        }
      });

      const ctxStreak = document.getElementById('streakChart').getContext('2d');
      if (streakChartInstance) streakChartInstance.destroy();
      streakChartInstance = new Chart(ctxStreak, {
        type: 'bar',
        data: {
          labels: habits.map(h => `${h.icon} ${h.name.slice(0, 14)}`),
          datasets: [{
            label: 'Días de racha',
            data: habits.map(h => calculateStreak(h)),
            backgroundColor: habits.map(h => h.color),
            borderRadius: 8
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, ticks: { stepSize: 1, color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#e2e8f0', font: { size: 11 } }, grid: { display: false } }
          }
        }
      });
    }

    function openModal() {
      document.getElementById('habitNameInput').value = '';
      document.getElementById('habitModal').classList.remove('hidden');
      document.getElementById('habitModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('habitModal').classList.add('hidden');
      document.getElementById('habitModal').classList.remove('flex');
    }

    function selectColor(color) {
      selectedColor = color;
      document.querySelectorAll('#colorPicker button').forEach(btn => {
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('ring-2', 'ring-white');
        } else {
          btn.classList.remove('ring-2', 'ring-white');
        }
      });
    }

    function saveNewHabit() {
      const name = document.getElementById('habitNameInput').value.trim();
      const icon = document.getElementById('habitIconInput').value.trim() || '⚡';
      const category = document.getElementById('habitTimeInput').value;
      if (!name) return alert('Escribe un nombre para el hábito');

      habits.push({
        id: 'h_' + Date.now(),
        name,
        icon,
        category,
        color: selectedColor,
        history: {}
      });
      saveData();
      closeModal();
      renderAll();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(habits, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `respaldo_ritmo_${formatDateKey(new Date())}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            habits = imported;
            saveData();
            renderAll();
            alert('¡Progreso importado correctamente!');
          }
        } catch (err) {
          alert('El archivo no es válido.');
        }
      };
      reader.readAsText(file);
    }

    // Inicializar App y PWA Service Worker
    loadData();
    renderAll();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById('pwa-install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
